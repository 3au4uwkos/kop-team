<!-- ====================== SECTION: DIRECTIONS — 3 full-screen wedges 120° ====================== -->
<section class="directions" id="directions" aria-label="Направления подготовки">
    <!--
      Секция 100vh разделена на три клиновидных сектора по 120°.
      Центр — середина секции. Каждый сектор = фото вида спорта (постер)
      + скрытое видео, которое подгружается и играет при наведении,
      + подпись с номером и названием дисциплины.
      Клик по сектору → якорная ссылка на соответствующую секцию.
    -->

    <a href="#combat"
       class="direction-sector direction-sector--combat"
       data-video="assets/video/combat-1.mp4"
       aria-label="Боевое самбо — перейти к разделу">
        <div class="direction-sector__media direction-sector__media--img"
             style="background-image: linear-gradient(135deg, #2a2a2e 0%, #0E0E10 100%);"></div>
        <video class="direction-sector__media direction-sector__media--video"
               muted loop playsinline preload="none"></video>
        <div class="direction-sector__veil" aria-hidden="true"></div>
        <div class="direction-sector__label">
            <div class="direction-sector__num">01</div>
            <div class="direction-sector__name">
                <span class="display--skew">Боевое</span><br>
                <span class="display--skew">самбо</span>
            </div>
            <div class="direction-sector__arrow" aria-hidden="true">→</div>
        </div>
    </a>

    <a href="#sambo"
       class="direction-sector direction-sector--sambo"
       data-video="assets/video/sambo-1.mp4"
       aria-label="Спортивное самбо — перейти к разделу">
        <div class="direction-sector__media direction-sector__media--img"
             style="background-image: linear-gradient(135deg, #E4002B 0%, #0E0E10 100%);"></div>
        <video class="direction-sector__media direction-sector__media--video"
               muted loop playsinline preload="none"></video>
        <div class="direction-sector__veil" aria-hidden="true"></div>
        <div class="direction-sector__label direction-sector__label--br">
            <div class="direction-sector__num">02</div>
            <div class="direction-sector__name">
                <span class="display--skew">Спортивное</span><br>
                <span class="display--skew">самбо</span>
            </div>
            <div class="direction-sector__arrow" aria-hidden="true">→</div>
        </div>
    </a>

    <a href="#striking"
       class="direction-sector direction-sector--striking"
       data-video="assets/video/striking-1.mp4"
       aria-label="Ударная техника — перейти к разделу">
        <div class="direction-sector__media direction-sector__media--img"
             style="background-image: linear-gradient(135deg, #0033A0 0%, #0E0E10 100%);"></div>
        <video class="direction-sector__media direction-sector__media--video"
               muted loop playsinline preload="none"></video>
        <div class="direction-sector__veil" aria-hidden="true"></div>
        <div class="direction-sector__label direction-sector__label--bl">
            <div class="direction-sector__num">03</div>
            <div class="direction-sector__name">
                <span class="display--skew">Ударная</span><br>
                <span class="display--skew">техника</span>
            </div>
            <div class="direction-sector__arrow" aria-hidden="true">→</div>
        </div>
    </a>

    <!-- Тонкие разделительные линии между секторами (поверх клипа) -->
    <svg class="directions__dividers" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <!-- луч 270° (вверх) идёт от центра к верху экрана — это НЕ граница секторов, граница у 90/210/330.
             В CSS-координатах (y вниз): бoundaries при 90° (вниз), 210° (вверх-влево), 330° (вверх-вправо). -->
        <line x1="50" y1="50" x2="50" y2="100" class="directions__divider-line"/>
        <line x1="50" y1="50" x2="-62" y2="-15" class="directions__divider-line"/>
        <line x1="50" y1="50" x2="162" y2="-15" class="directions__divider-line"/>
    </svg>
</section>
