# ================================================================
# Сборка Astro -> бюджет Lighthouse -> публикация на GitHub Pages
# -> уведомление поисковиков (IndexNow).
# Деплой стоит за проверкой бюджета: сборка, не уложившаяся в пороги,
# на прод не уезжает.
#
# В настройках репозитория: Settings -> Pages -> Source = GitHub Actions.
# ================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Полная история: lastmod в sitemap.xml — дата последнего коммита
      # по файлам страницы; в мелком клоне у всех была бы дата HEAD.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  lighthouse:
    name: Performance budget
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Берём ту же статику, что поедет на прод, вместо повторной сборки.
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Unpack artifact
        run: |
          mkdir -p dist
          tar -xf artifact.tar -C dist
          ls -la dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-report

  deploy:
    name: Deploy
    needs: lighthouse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow: сообщаем Яндексу и Bing, что страницы обновились, — переобход
  # за часы вместо недель. Ключ — имя и содержимое public/<ключ>.txt: по нему
  # поисковики проверяют, что пишет владелец сайта. Адреса берём из sitemap
  # уже опубликованного сайта. Уведомление не часть деплоя: при сбое —
  # предупреждение в сводке запуска, job остаётся зелёным.
  indexnow:
    name: IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_HOST: kop-team.ru
      INDEXNOW_KEY: ef7e6ea64540873b47d65839676aaa7f
    steps:
      - name: Notify Yandex and Bing
        run: |
          site="https://$SITE_HOST"
          urls=$(curl -fsS "$site/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g') || true
          if [ -z "$urls" ]; then
            echo "::warning::IndexNow: не удалось получить адреса из $site/sitemap.xml"
            exit 0
          fi
          echo "$urls"

          body=$(jq -n --arg host "$SITE_HOST" --arg key "$INDEXNOW_KEY" \
            --arg loc "$site/$INDEXNOW_KEY.txt" --arg urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: ($urls | split("\n"))}')

          # 200 — принято; 202 — принято, ключ ещё проверяется.
          # api.indexnow.org раздаёт адреса Bing и остальным участникам протокола.
          for endpoint in https://yandex.com/indexnow https://api.indexnow.org/indexnow; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data "$body" "$endpoint") || code=000
            echo "$endpoint -> $code"
            case "$code" in
              200|202) ;;
              *) echo "::warning::IndexNow: $endpoint ответил $code" ;;
            esac
          done
