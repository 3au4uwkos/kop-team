# ================================================================
# Сборка Astro -> бюджет Lighthouse -> публикация на GitHub Pages.
# Деплой стоит за проверкой бюджета: сборка, не уложившаяся в пороги,
# на прод не уезжает.
#
# В настройках репозитория: Settings -> Pages -> Source = GitHub Actions.
# ================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  lighthouse:
    name: Performance budget
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Берём ту же статику, что поедет на прод, вместо повторной сборки.
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Unpack artifact
        run: |
          mkdir -p dist
          tar -xf artifact.tar -C dist
          ls -la dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-report

  deploy:
    name: Deploy
    needs: lighthouse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
