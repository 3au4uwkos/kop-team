# ================================================================
# GitVerse Pages: сборка Astro и публикация статики.
#
# Триггер — push в master. Собирается dist/, он же и публикуется:
# до миграции на Astro сюда уезжал корень репозитория, теперь это
# сломало бы сайт (в корне лежат исходники, а не готовая статика).
#
# Именование артефакта (gitverse-pages) намеренно оставлено как было:
# это единственная часть конфигурации, которая завязана на форк
# действий у GitVerse и уже работала до миграции.
# ================================================================
name: GitVerse Pages Static

on:
  push:
    branches: [master]
  workflow_dispatch:

# Публикуем только последний коммит: параллельные деплои затирали бы
# друг друга, а очередь из них бессмысленна.
concurrency:
  group: gitverse-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci, а не install: ставит ровно то, что в package-lock.json,
      # и падает при расхождении вместо тихого обновления зависимостей.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Пустой dist означает, что сборка прошла вхолостую, — лучше
      # уронить job здесь, чем опубликовать пустой сайт.
      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/sitemap-index.xml
          echo "Собрано страниц: $(find dist -name '*.html' | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Go необходим для выполнения deploy-pages
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
