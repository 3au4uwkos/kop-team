# ================================================================
# GitVerse Pages: сборка Astro и публикация статики (зеркало сайта).
#
# Почему падал деплой (task 2414887, 30.09.2026): deploy-pages находил
# артефакт, но POST /repos/3au4uwkos/kop-team/pages/deployments отвечал
# 404 — для репозитория не включены «Страницы». Это настройка, а не код:
#
#   GitVerse → репозиторий → Настройки → Страницы →
#   включить, Источник = «Воркфлоу», сохранить.
#
# (Если источник выбран «Ветка», экшен вернёт 417 «wrong pages source
# type».) Требования GitVerse: репозиторий публичный, CI/CD включён.
#
# deploy-pages закреплён на v1.0.0: плавающий тег v1 раннер брал из
# устаревшего кеша («Unable to pull refs/heads/v1» в логе). Документация
# пишет gitverse/…, но таких репозиториев нет — рабочие лежат в actions/.
#
# Загрузка артефакта — с таймаутом и двумя повторами (task 2414976):
# хранилище артефактов GitVerse иногда вешает запрос, а сам экшен
# таймаута не имеет. Подробности — у шага загрузки ниже.
#
# Сайт проекта на GitVerse живёт в подкаталоге:
#   https://3au4uwkos.gitverse.site/kop-team/
# (свои домены GitVerse не поддерживает), поэтому сборка идёт
# с SITE_BASE=/kop-team — см. astro.config.mjs и src/lib/url.ts.
# ================================================================
name: GitVerse Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Публикуем только последний коммит: параллельные деплои затирали бы
# друг друга, а очередь из них бессмысленна.
concurrency:
  group: gitverse-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci, а не install: ставит ровно то, что в package-lock.json,
      # и падает при расхождении вместо тихого обновления зависимостей.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_BASE: /kop-team

      # Пустой dist или пути без /kop-team/ означают сломанное зеркало —
      # лучше уронить job здесь, чем опубликовать такой сайт.
      - name: Check build output
        run: |
          test -f dist/index.html
          grep -q '/kop-team/_astro/' dist/index.html
          echo "Собрано страниц: $(find dist -name '*.html' | wc -l)"
          du -sh dist

      # Загрузка артефакта — с таймаутом и повторами.
      #
      # Почему не upload-pages-artifact (task 2414976, 30.09.2026): он лишь
      # обёртка над upload-artifact, а форк upload-artifact у GitVerse шлёт
      # архив кусками по 8 МБ без таймаута на кусок. Один запрос к их
      # хранилищу повис на 25 из ~40 МБ — шаг ждал 30 минут, пока раннер
      # не убил job. Те же ~40 МБ в прошлом запуске загрузились нормально,
      # так что это сбой инфраструктуры, а не лимит: лечится повтором.
      #
      # Параметры те же, что у upload-pages-artifact (имя gitverse-pages —
      # его ждёт deploy-pages, хранение 1 день), плюс overwrite: повтор
      # заменяет недокачанную попытку. compression-level 0: фото и видео
      # уже сжаты, zip только тратил бы время.
      - name: Upload pages artifact
        id: upload1
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/upload-artifact@v4
        with:
          name: gitverse-pages
          path: dist
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload pages artifact (повтор 1)
        id: upload2
        if: steps.upload1.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/upload-artifact@v4
        with:
          name: gitverse-pages
          path: dist
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload pages artifact (повтор 2)
        if: steps.upload1.outcome != 'success' && steps.upload2.outcome != 'success'
        timeout-minutes: 8
        uses: actions/upload-artifact@v4
        with:
          name: gitverse-pages
          path: dist
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # deploy-pages написан на Go (runs.using: go) — без Go он не стартует.
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        timeout-minutes: 20
        uses: actions/deploy-pages@v1.0.0

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
