# ================================================================
# Зеркало GitVerse Pages. После миграции на Astro публикуем не корень
# репозитория, а собранную статику из dist/.
# ================================================================
name: GitVerse Pages Static

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Go необходим для выполнения deploy-pages
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
